[project]
name = "evalforge"
version = "0.1.0"
description = "General-purpose LLM eval harness with JSON test cases, Groq-judged scoring, and regression detection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
evalforge = "evalforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalforge"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # evalforge.schema.TestCase is a domain model, not a pytest test class
    "ignore::pytest.PytestCollectionWarning",
]
